name: Keep Render Backend Warm

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Medusa Backend
        run: |
          echo "Pinging backend to keep it warm..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://medusa-demo-backend.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️  Backend returned status $STATUS (may be waking up)"
          fi
